apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: lumora-prod
  labels:
    app: flask-app
    tier: frontend
    cost-center: Multicloud-Mavericks
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
        tier: frontend
        cost-center: Multicloud-Mavericks
    spec:
      containers:
        - name: lumora-ecommerce
          image: 759530261212.dkr.ecr.us-east-1.amazonaws.com/lumora-ecommerce-flask:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: flask-config
            - secretRef:
                name: flask-secrets
          env:
            # Safely expand the MongoDB password into the connection URI
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flask-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_URI
              value: "mongodb://admin:$(MONGO_INITDB_ROOT_PASSWORD)@mongodb-service:27017/ecommerce?authSource=admin"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.x-k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "aws-secrets-provider"