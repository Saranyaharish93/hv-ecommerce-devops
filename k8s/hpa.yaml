apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hv-ecommerce
  namespace: hv-ecommerce
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hv-ecommerce
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
