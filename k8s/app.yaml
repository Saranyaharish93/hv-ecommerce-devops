apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  namespace: hv-ecommerce
type: Opaque
stringData:
  SECRET_KEY: change-this-in-production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hv-ecommerce
  namespace: hv-ecommerce
spec:
  replicas: 2
  selector:
    matchLabels: { app: hv-ecommerce }
  template:
    metadata:
      labels: { app: hv-ecommerce }
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports: [{ containerPort: 5000 }]
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/ecommerce
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: ecommerce-secret, key: SECRET_KEY } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hv-ecommerce
  namespace: hv-ecommerce
spec:
  type: LoadBalancer
  selector: { app: hv-ecommerce }
  ports: [{ port: 80, targetPort: 5000 }]
