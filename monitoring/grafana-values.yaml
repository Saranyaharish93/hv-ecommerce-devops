grafana:
  enabled: true

  replicas: 1

  service:
    type: ClusterIP
    port: 80

  persistence:
    enabled: true
    type: pvc
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  adminUser: admin

  defaultDashboardsEnabled: true