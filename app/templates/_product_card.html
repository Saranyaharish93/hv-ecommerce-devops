<article class="product-card">{% if logged_in_user and logged_in_role != 'admin' %}<form class="card-wishlist" method="post" action="{{ url_for('main.toggle_wishlist', product_id=product.id) }}"><button title="Save to wishlist">♡</button></form>{% endif %}<a class="product-image" href="{{ url_for('main.product_detail', product_id=product.id) }}">{% if product.badge %}<span class="badge">{{ product.badge }}</span>{% endif %}<img src="{{ product.image }}" alt="{{ product.name }}"><span class="quick-view">View details</span></a><div class="product-info"><div><small>{{ product.category }}</small><h3><a href="{{ url_for('main.product_detail', product_id=product.id) }}">{{ product.name }}</a></h3><span class="rating">★ {{ product.rating }}</span></div><div class="price-row"><strong>₹{{ '{:,.0f}'.format(product.price) }}</strong><form method="post" action="{{ url_for('main.add_to_cart', product_id=product.id) }}"><button class="add-btn" title="Add to bag">+</button></form></div></div></article>
