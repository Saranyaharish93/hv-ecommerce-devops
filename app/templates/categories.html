{% extends 'base.html' %}{% block title %}Collections — Lumora{% endblock %}{% block content %}<section class="page-hero shell"><span class="eyebrow">SHOP BY ENERGY</span><h1>Collections with<br><em>a point of view.</em></h1></section><section class="shell category-gallery">{% for category in categories %}<a class="category-tile" href="{{ url_for('main.shop', category=category.name) }}"><img src="{{ category.image }}" alt="{{ category.name }}"><div><span>0{{ loop.index }} / {{ category.count }} pieces</span><h2>{{ category.name }}</h2><b>Explore ↗</b></div></a>{% endfor %}</section>{% endblock %}
