---
- name: Check if Infracost is installed
  command: infracost --version
  register: infracost_check
  ignore_errors: true
  changed_when: false

- name: Download and install Infracost CLI
  when: infracost_check.rc != 0
  block:
    - name: Download Infracost Linux amd64 archive
      get_url:
        url: "https://github.com/infracost/infracost/releases/latest/download/infracost-linux-amd64.tar.gz"
        dest: "/tmp/infracost-linux-amd64.tar.gz"
        mode: '0644'

    - name: Extract Infracost archive
      unarchive:
        src: "/tmp/infracost-linux-amd64.tar.gz"
        dest: "/tmp"
        remote_src: yes

    - name: Move Infracost binary to /usr/local/bin
      copy:
        src: "/tmp/infracost-linux-amd64"
        dest: "/usr/local/bin/infracost"
        mode: '0755'
        remote_src: yes

    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/infracost-linux-amd64.tar.gz"
        - "/tmp/infracost-linux-amd64"